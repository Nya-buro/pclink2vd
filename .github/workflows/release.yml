name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pclink2vd.exe
          generate_release_notes: true
